<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BLACK APPLE</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      
      // If deployed at root user page https://<username>.github.io/, pathSegmentsToKeep is 0.
      // If deployed at project page https://<username>.github.io/<repo-name>/, pathSegmentsToKeep is 1.
      var isSubpath = window.location.pathname.startsWith('/blackapple');
      var pathSegmentsToKeep = isSubpath ? 1 : 0;

      var l = window.location;
      var repoPrefix = pathSegmentsToKeep > 0 
        ? l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')
        : '';
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPrefix + '/?/' +
        routePath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
